name: TAM Cap Cloudflare images

on:
  workflow_dispatch:
    inputs:
      target:
        description: Application origin to compile into the web image
        type: choice
        required: true
        default: staging
        options: [staging, production]
  push:
    branches: [codex/cloudflare-self-host]
    paths:
      - .github/workflows/tam-web-images.yml

permissions:
  contents: read

concurrency:
  group: tam-cap-images-${{ github.ref }}-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/codex/cloudflare-self-host'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      BUILD_TARGET: ${{ inputs.target || 'staging' }}
      REGISTRY_NAMESPACE: registry.cloudflare.com/c1e96a4b36c73f3cf4ddf50a90082d94
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - name: Select exact origin and revision tags
        shell: bash
        run: |
          set -euo pipefail
          case "$BUILD_TARGET" in
            staging) origin=https://tam-cap-app.ciglesia.workers.dev ;;
            production) origin=https://videos.trulyauthenticmarketing.com ;;
            *) echo "Invalid image target" >&2; exit 1 ;;
          esac
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          {
            printf 'ORIGIN=%s\n' "$origin"
            printf 'WEB_IMAGE_TAG=%s/tam-cap-web:sha-%s-%s\n' "$REGISTRY_NAMESPACE" "$GITHUB_SHA" "$BUILD_TARGET"
            printf 'MEDIA_IMAGE_TAG=%s/tam-cap-media:sha-%s-%s\n' "$REGISTRY_NAMESPACE" "$GITHUB_SHA" "$BUILD_TARGET"
          } >> "$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE"
      - name: Build web image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --load \
            --file Dockerfile.cloudflare \
            --target web \
            --build-arg "NEXT_PUBLIC_WEB_URL=$ORIGIN" \
            --tag "$WEB_IMAGE_TAG" \
            .
      - name: Build media image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --load \
            --file Dockerfile.cloudflare \
            --target media \
            --tag "$MEDIA_IMAGE_TAG" \
            .
      - name: Push to the private Cloudflare registry and record immutable images
        shell: bash
        env:
          TAM_CAP_REGISTRY_USERNAME: ${{ secrets.TAM_CAP_REGISTRY_USERNAME }}
          TAM_CAP_REGISTRY_PASSWORD: ${{ secrets.TAM_CAP_REGISTRY_PASSWORD }}
          DOCKER_CONFIG: ${{ runner.temp }}/tam-cap-registry-auth
        run: |
          set -euo pipefail
          [[ -n "$TAM_CAP_REGISTRY_USERNAME" && -n "$TAM_CAP_REGISTRY_PASSWORD" ]]
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout registry.cloudflare.com >/dev/null 2>&1 || true; rm -f "$DOCKER_CONFIG/config.json"' EXIT
          printf '%s' "$TAM_CAP_REGISTRY_PASSWORD" | docker login registry.cloudflare.com --username "$TAM_CAP_REGISTRY_USERNAME" --password-stdin
          docker push "$WEB_IMAGE_TAG"
          docker push "$MEDIA_IMAGE_TAG"
          docker image inspect --format '{{json .RepoDigests}}' "$WEB_IMAGE_TAG" > "$RUNNER_TEMP/tam-cap-web-digests.json"
          docker image inspect --format '{{json .RepoDigests}}' "$MEDIA_IMAGE_TAG" > "$RUNNER_TEMP/tam-cap-media-digests.json"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import path from "node:path";
          const namespace = process.env.REGISTRY_NAMESPACE;
          const select = (file, repository) => {
            const values = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, file), "utf8"));
            const prefix = `${namespace}/${repository}@sha256:`;
            const matches = values.filter((value) => value.startsWith(prefix) && /^[0-9a-f]{64}$/.test(value.slice(prefix.length)));
            if (matches.length !== 1) throw new Error(`Expected one immutable digest for ${repository}`);
            return matches[0];
          };
          const origin = process.env.ORIGIN;
          if (!["https://tam-cap-app.ciglesia.workers.dev", "https://videos.trulyauthenticmarketing.com"].includes(origin)) throw new Error("Invalid build origin");
          const result = {
            webImage: select("tam-cap-web-digests.json", "tam-cap-web"),
            mediaImage: select("tam-cap-media-digests.json", "tam-cap-media"),
            origin,
            sourceRevision: process.env.GITHUB_SHA,
          };
          writeFileSync("image-manifest.json", `${JSON.stringify(result, null, 2)}\n`);
          NODE
      - name: Upload image manifest
        uses: actions/upload-artifact@v4
        with:
          name: tam-cap-image-manifest-${{ env.BUILD_TARGET }}
          path: image-manifest.json
          if-no-files-found: error
          retention-days: 7
